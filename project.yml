name: FragranceLibrary
options:
  bundleIdPrefix: com.fragrancelibrary
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "26.3"

settings:
  base:
    SWIFT_VERSION: "5.0"
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"

targets:
  FragranceLibrary:
    type: application
    platform: iOS
    sources:
      - path: FragranceLibrary
        type: group
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fragrancelibrary.app
        DEVELOPMENT_TEAM: VYT2UG3MYT
        CODE_SIGN_STYLE: Automatic
        INFOPLIST_KEY_CFBundleDisplayName: "Fragrance Library"
        INFOPLIST_KEY_NSCameraUsageDescription: "We need camera access to take photos of your perfume bottles."
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "We need photo library access so you can choose existing perfume photos."
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: "YES"
        INFOPLIST_KEY_UILaunchStoryboardName: LaunchScreen
        INFOPLIST_KEY_UIUserInterfaceStyle: Light
        INFOPLIST_KEY_UIRequiredDeviceCapabilities:
          - arm64
        INFOPLIST_KEY_UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        GENERATE_INFOPLIST_FILE: "YES"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    preBuildScripts:
      - name: "SwiftLint"
        script: |
          if which swiftlint > /dev/null; then
            swiftlint --config "${SRCROOT}/.swiftlint.yml" 2>/dev/null || true
          fi
        basedOnDependencyAnalysis: false
